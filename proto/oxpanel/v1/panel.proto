syntax = "proto3";

package oxpanel.v1;

import "google/protobuf/timestamp.proto";

// OxPanelEngine is the privileged system engine of OxPanel.
//
// It is reachable ONLY over a local UNIX-domain socket. Every call is
// authenticated by the kernel-supplied peer credentials (SO_PEERCRED) of the
// connecting process against a configured allow-list; there is no in-band
// authentication and no network transport.
//
// All operations are idempotent: repeating a request with identical arguments
// after a success returns the same result and `created`/`deleted` = false.
service OxPanelEngine {
  // Provision an isolated POSIX tenant: a dedicated user + primary group,
  // a mode-0700 home directory, and a systemd slice carrying its resource limits.
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  // Remove a tenant that OxPanel created. Refuses to touch users it does not manage.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);

  // Create or update an Nginx server block for a domain owned by a tenant.
  // The configuration is validated with `nginx -t` before it is activated and
  // rolled back if validation fails.
  rpc ConfigureVirtualHost(ConfigureVirtualHostRequest) returns (ConfigureVirtualHostResponse);
  rpc RemoveVirtualHost(RemoveVirtualHostRequest) returns (RemoveVirtualHostResponse);
  rpc ListVirtualHosts(ListVirtualHostsRequest) returns (ListVirtualHostsResponse);
  // Restart a virtual host's application (after new code was put in place).
  rpc RestartApp(RestartAppRequest) returns (RestartAppResponse);
  // Install the application's dependencies as the tenant: `npm install` for
  // Node.js, `pip install -r requirements.txt` into the app's virtualenv for
  // Python. The application is restarted when the installation succeeds.
  rpc InstallAppDependencies(InstallAppDependenciesRequest) returns (InstallAppDependenciesResponse);
  // The end of a virtual host's access or error log.
  rpc ReadVirtualHostLog(ReadVirtualHostLogRequest) returns (ReadVirtualHostLogResponse);

  // Replace a tenant's resource limits. Applied through systemd immediately.
  rpc UpdateTenantLimits(UpdateTenantLimitsRequest) returns (UpdateTenantResponse);
  // Replace a tenant's owner label (e.g. move it to another reseller).
  rpc UpdateTenantOwner(UpdateTenantOwnerRequest) returns (UpdateTenantResponse);
  // Suspend a tenant: every virtual host it owns answers 503 until resumed.
  // Files, limits and the account are left untouched.
  rpc SuspendTenant(SuspendTenantRequest) returns (UpdateTenantResponse);
  rpc ResumeTenant(ResumeTenantRequest) returns (UpdateTenantResponse);
  // Current resource consumption of one tenant.
  rpc GetTenantUsage(GetTenantUsageRequest) returns (TenantUsage);

  // Engine version, capacity and host load.
  rpc GetHostInfo(GetHostInfoRequest) returns (HostInfo);
  // Compare every record with the operating system and report differences.
  // Read-only: nothing is repaired.
  rpc Reconcile(ReconcileRequest) returns (ReconcileResponse);

  // Install a certificate chain and its private key for a virtual host
  // ("bring your own certificate"); the site is then also served on port 443.
  // The key must match the certificate, the certificate must cover the
  // virtual host's domain and be within its validity period.
  rpc InstallCertificate(InstallCertificateRequest) returns (InstallCertificateResponse);
  // Remove a virtual host's certificate and key; the site is HTTP-only again.
  rpc RemoveCertificate(RemoveCertificateRequest) returns (RemoveCertificateResponse);
  // Obtain (or renew now) a certificate for the virtual host's domain and
  // aliases from the configured ACME certificate authority (HTTP-01).
  // May take a minute or two.
  rpc RequestCertificate(RequestCertificateRequest) returns (RequestCertificateResponse);
  // Renew every ACME certificate that is due. The engine also does this by
  // itself twice a day.
  rpc RenewCertificates(RenewCertificatesRequest) returns (RenewCertificatesResponse);
  // Automatic HTTPS: obtain certificates for sites now instead of waiting for
  // the engine's own schedule. With a domain: that site, ignoring back-off.
  // Without: every site, respecting back-off. May take minutes.
  rpc RunAutoHttps(RunAutoHttpsRequest) returns (RunAutoHttpsResponse);
  // Automatic HTTPS: what it has done and will do for one or all sites.
  rpc GetAutoHttpsStatus(GetAutoHttpsStatusRequest) returns (GetAutoHttpsStatusResponse);
  // SFTP access. A tenant with at least one key can log in over SFTP — SFTP
  // only (no shell, no forwarding of any kind), confined to its own home.
  // Adding a key the tenant already has changes nothing but its label.
  // FAILED_PRECONDITION if sshd is missing or would not confine the tenant.
  rpc AddSftpKey(AddSftpKeyRequest) returns (AddSftpKeyResponse);
  // Remove one key: it cannot start a new session. Running sessions continue
  // unless `end_sessions` is set. Removing the last key (with no password
  // either) removes SFTP access altogether. NOT_FOUND if the tenant has no
  // such key.
  rpc RemoveSftpKey(RemoveSftpKeyRequest) returns (RemoveSftpKeyResponse);
  rpc ListSftpKeys(ListSftpKeysRequest) returns (ListSftpKeysResponse);
  // Give the tenant an SFTP password, or replace it. Same confinement as a
  // key (SFTP only, chrooted, no forwarding). Stored only as the system's
  // password hash; never returned. FAILED_PRECONDITION if the host forbids
  // SFTP passwords (HostInfo.sftp_passwords_allowed) or cannot confine the
  // tenant.
  rpc SetSftpPassword(SetSftpPasswordRequest) returns (SetSftpPasswordResponse);
  // Remove the tenant's SFTP password: it cannot start a new session.
  // Running sessions continue unless `end_sessions` is set.
  rpc ClearSftpPassword(ClearSftpPasswordRequest) returns (ClearSftpPasswordResponse);
}

// Per-tenant resource limits, applied through systemd (cgroups v2).
// A zero value means "leave the systemd default".
message ResourceLimits {
  // systemd MemoryMax= in bytes. 0 = unlimited.
  uint64 memory_max_bytes = 1;
  // systemd CPUWeight=, 1..=10000. 0 = default (100).
  uint32 cpu_weight = 2;
  // systemd IOWeight=, 1..=10000. 0 = default (100).
  uint32 io_weight = 3;
  // systemd TasksMax=. 0 = default.
  uint32 tasks_max = 4;
  // Disk space the tenant's files may occupy on the file system holding the
  // homes, enforced by the kernel (XFS user quota): a write beyond it fails.
  // 0 = unlimited; otherwise at least 1 MiB (rounded down to whole KiB).
  // FAILED_PRECONDITION if the host does not enforce quotas (see
  // HostInfo.disk_quota_available).
  uint64 disk_max_bytes = 5;
  // Number of files and directories the tenant may own there. 0 = unlimited;
  // otherwise at least 100. Same precondition as disk_max_bytes.
  uint64 inodes_max = 6;
}

message Tenant {
  string username = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  string home = 4;
  ResourceLimits limits = 5;
  // Name of the systemd slice unit that carries the limits, e.g. "oxpanel-tenant-alice.slice".
  string slice_unit = 6;
  google.protobuf.Timestamp created_at = 7;
  TenantState state = 8;
  // Opaque label of the owning account in the panel (e.g. a reseller id).
  // The engine stores and filters by it; it carries no OS meaning.
  string owner = 9;
  // True while the tenant is suspended (its sites answer 503).
  bool suspended = 10;
  // Number of SSH keys that may log in over SFTP.
  uint32 sftp_key_count = 11;
  // The tenant has an SFTP password. (SFTP access: a key or a password.)
  bool sftp_password = 12;
}

enum TenantState {
  TENANT_STATE_UNSPECIFIED = 0;
  // useradd succeeded but post-provisioning steps (limits, labels) are not
  // all confirmed. A repeated CreateTenant call resumes them.
  TENANT_STATE_PROVISIONING = 1;
  TENANT_STATE_READY = 2;
  // DeleteTenant in progress; a repeated call resumes it.
  TENANT_STATE_DELETING = 3;
}

message CreateTenantRequest {
  // 3..=32 chars, ^[a-z][a-z0-9_-]*$; reserved system names are rejected.
  string username = 1;
  ResourceLimits limits = 2;
  // Optional owner label: ^[a-z0-9][a-z0-9_.-]{0,63}$ or empty. Part of the
  // tenant specification for idempotency purposes.
  string owner = 3;
}

message CreateTenantResponse {
  Tenant tenant = 1;
  // false when the tenant already existed with an identical specification.
  bool created = 2;
}

message GetTenantRequest {
  string username = 1;
}

message ListTenantsRequest {
  // Empty = all tenants; otherwise only tenants with this owner label.
  string owner = 1;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
}

message DeleteTenantRequest {
  string username = 1;
  // Also delete the home directory. Default: keep it.
  bool remove_home = 2;
}

message DeleteTenantResponse {
  // false when the tenant did not exist.
  bool deleted = 1;
}

message VirtualHost {
  string domain = 1;
  string tenant = 2;
  // Path relative to the tenant home, e.g. "public_html".
  string document_root = 3;
  repeated string aliases = 4;
  // Absolute path of the generated Nginx configuration file.
  string config_path = 5;
  // PHP is enabled: *.php is executed by the tenant's own PHP-FPM pool.
  bool php = 6;
  // Set when the virtual host runs an application.
  App app = 7;
  // The installed certificate; absent when the site is HTTP-only.
  Certificate certificate = 8;
  // As requested; they take effect only while a certificate is installed.
  bool redirect_https = 9;
  bool hsts = 10;
  // The site is excluded from Automatic HTTPS (see GetAutoHttpsStatus).
  bool auto_https_opt_out = 11;
}

enum AppRuntime {
  APP_RUNTIME_UNSPECIFIED = 0;
  // `node <entry>`
  APP_RUNTIME_NODE = 1;
  // `<root>/.venv/bin/python <entry>`; the virtualenv is created for the app.
  APP_RUNTIME_PYTHON = 2;
}

// A long-running application behind a virtual host. It runs as the tenant in
// its own sandboxed service inside the tenant's slice and must listen on the
// UNIX socket whose path it receives in the PORT (and OXPANEL_SOCKET)
// environment variable. Nginx serves files that exist in the document root
// itself and passes every other request to the application.
message App {
  AppRuntime runtime = 1;
  // Application directory relative to the tenant home; created (owned by the
  // tenant) if absent. Empty = "apps/<domain>". Not readable by the web server.
  string root = 2;
  // Program to run, relative to `root`. Empty = "app.js" / "app.py".
  string entry = 3;
}

message ConfigureVirtualHostRequest {
  // Fully-qualified host name, lower-case ASCII (IDNA A-label / punycode allowed).
  string domain = 1;
  // Username of an OxPanel-managed tenant that owns the domain.
  string tenant = 2;
  // Path relative to the tenant home; created (owned by the tenant) if absent.
  // Empty = "public_html".
  string document_root = 3;
  // Additional server_name entries, each validated like `domain`.
  repeated string aliases = 4;
  // Execute *.php through the tenant's PHP-FPM pool. The pool runs as the
  // tenant, inside the tenant's slice, and is created on first use and
  // removed with the tenant's last PHP-enabled virtual host.
  // FAILED_PRECONDITION if PHP-FPM is not installed on the host.
  bool php = 5;
  // Run an application behind this virtual host. Cannot be combined with
  // `php`. FAILED_PRECONDITION if the runtime is not installed on the host.
  App app = 6;
  // Answer plain-HTTP requests with a redirect to HTTPS. Takes effect only
  // while a certificate is installed (ACME challenges are still answered
  // over HTTP).
  bool redirect_https = 7;
  // Send `Strict-Transport-Security: max-age=31536000` over HTTPS. Browsers
  // remember it for a year: enable it only once HTTPS is there to stay.
  // Takes effect only while a certificate is installed.
  bool hsts = 8;
  // Exclude this site from Automatic HTTPS. Default (false): when Automatic
  // HTTPS is on for the host, the site gets a certificate by itself.
  bool auto_https_opt_out = 9;
}

message ConfigureVirtualHostResponse {
  VirtualHost vhost = 1;
  // false when an identical configuration was already active.
  bool created = 2;
}

message RemoveVirtualHostRequest {
  string domain = 1;
}

message RemoveVirtualHostResponse {
  // false when no such virtual host existed.
  bool removed = 1;
}

message ListVirtualHostsRequest {
  // Empty = all tenants.
  string tenant = 1;
}

message ListVirtualHostsResponse {
  repeated VirtualHost vhosts = 1;
}

message UpdateTenantLimitsRequest {
  string username = 1;
  // The complete new set of limits (not a patch). Absent = no limits.
  ResourceLimits limits = 2;
}

message UpdateTenantOwnerRequest {
  string username = 1;
  // New owner label; empty clears it.
  string owner = 2;
}

message SuspendTenantRequest {
  string username = 1;
}

message ResumeTenantRequest {
  string username = 1;
}

message UpdateTenantResponse {
  Tenant tenant = 1;
  // false when the tenant already had exactly this value.
  bool changed = 2;
}

message GetTenantUsageRequest {
  string username = 1;
}

// A point-in-time measurement. Memory, CPU and tasks cover the tenant slice
// and the tenant's login-session slice together; 0 when nothing is running.
message TenantUsage {
  string username = 1;
  uint64 memory_current_bytes = 2;
  // Total CPU time consumed since the slices were started.
  uint64 cpu_usage_nsec = 3;
  uint64 tasks_current = 4;
  // Disk space in use. Where disk quotas are enforced this is the quota
  // system's figure (everything the tenant's uid owns on the file system
  // holding the homes); elsewhere, the space allocated under the home.
  uint64 disk_usage_bytes = 5;
  google.protobuf.Timestamp measured_at = 6;
}

message GetHostInfoRequest {}

message HostInfo {
  string daemon_version = 1;
  bool selinux_enabled = 2;
  bool dry_run = 3;
  uint32 tenant_count = 4;
  uint32 vhost_count = 5;
  // Inclusive uid range tenants are allocated from (capacity = max - min + 1).
  uint32 uid_min = 6;
  uint32 uid_max = 7;
  double load_1m = 8;
  double load_5m = 9;
  double load_15m = 10;
  uint64 memory_total_bytes = 11;
  uint64 memory_free_bytes = 12;
  // The file system that holds tenant homes.
  uint64 home_disk_total_bytes = 13;
  uint64 home_disk_free_bytes = 14;
  uint64 uptime_seconds = 15;
  // PHP-FPM is installed, so virtual hosts may enable `php`.
  bool php_available = 16;
  // Node.js (version 22 or newer) / Python are installed, so virtual hosts
  // may run such applications.
  bool node_available = 17;
  bool python_available = 18;
  // Installed Node.js version, e.g. "22.11.0"; empty if none. A version
  // older than 22 is reported here while `node_available` stays false.
  string node_version = 19;
  // OpenSSL is installed, so certificates can be installed.
  bool tls_available = 20;
  // The ACME client, its account and its directories are in place, so
  // certificates can be requested.
  bool acme_available = 21;
  // The ACME directory certificates are requested from.
  string acme_directory_url = 22;
  // Automatic HTTPS is switched on for the host (OXPANEL_AUTO_HTTPS).
  bool auto_https_enabled = 23;
  // sshd is installed and OxPanel's drop-in is in place, so tenants can be
  // given SFTP access.
  bool sftp_available = 24;
  // The file system holding tenant homes enforces user quotas, so tenants
  // can be given disk limits.
  bool disk_quota_available = 25;
  // What was found about quotas, and when they are not available, what the
  // operator has to change.
  string disk_quota_detail = 26;
  // Tenants may be given SFTP passwords (OXPANEL_SFTP_PASSWORDS, default
  // true). When false, SetSftpPassword is refused and sshd offers password
  // authentication to no tenant.
  bool sftp_passwords_allowed = 27;
}

message ReconcileRequest {}

enum DriftKind {
  DRIFT_KIND_UNSPECIFIED = 0;
  // A tenant record is not in state READY (interrupted create or delete).
  DRIFT_KIND_TENANT_INCOMPLETE = 1;
  // The record exists but the POSIX account does not.
  DRIFT_KIND_TENANT_ACCOUNT_MISSING = 2;
  // uid, gid or home of the account differ from the record.
  DRIFT_KIND_TENANT_ACCOUNT_MISMATCH = 3;
  // The home is missing, not a directory, wrongly owned or open to others.
  DRIFT_KIND_TENANT_HOME_INVALID = 4;
  // A slice unit or drop-in is missing or differs from the recorded limits.
  DRIFT_KIND_TENANT_UNIT_DRIFT = 5;
  // A virtual host names a tenant that has no record.
  DRIFT_KIND_VHOST_TENANT_MISSING = 6;
  // The Nginx file is missing or differs from what the record renders to.
  DRIFT_KIND_VHOST_CONFIG_DRIFT = 7;
  // A file in the OxPanel Nginx directory that no record accounts for.
  DRIFT_KIND_ORPHAN_NGINX_CONFIG = 8;
  // An oxpanel-tenant-*.slice unit that no record accounts for.
  DRIFT_KIND_ORPHAN_SLICE_UNIT = 9;
  // A tenant's PHP-FPM pool configuration or service unit is missing or
  // differs from what the records render to.
  DRIFT_KIND_PHP_POOL_DRIFT = 10;
  // A PHP-FPM pool file or unit that no PHP-enabled virtual host accounts for.
  DRIFT_KIND_ORPHAN_PHP_POOL = 11;
  // An application's service unit is missing or differs from its record.
  DRIFT_KIND_APP_UNIT_DRIFT = 12;
  // An oxpanel-app-*.service unit that no virtual host accounts for.
  DRIFT_KIND_ORPHAN_APP_UNIT = 13;
  // A virtual host's certificate file is missing or differs from the record,
  // or its private key is missing or readable by others.
  DRIFT_KIND_TLS_CERTIFICATE_DRIFT = 14;
  // A file in the OxPanel certificate directory that no virtual host accounts for.
  DRIFT_KIND_ORPHAN_TLS_FILE = 15;
  // Automatic HTTPS state kept for a virtual host that does not exist.
  DRIFT_KIND_ORPHAN_AUTO_HTTPS_STATE = 16;
  // A tenant's SFTP keys file or home mount unit is missing or differs from
  // the record, or the account is not in the tenant group.
  DRIFT_KIND_SFTP_ACCESS_DRIFT = 18;
  // A keys file, mount unit or chroot directory that no tenant accounts for.
  DRIFT_KIND_ORPHAN_SFTP_ACCESS = 19;
  // OxPanel's sshd drop-in is missing or edited.
  DRIFT_KIND_SSHD_CONFIG_DRIFT = 20;
  // The kernel's disk quota for a tenant differs from its recorded limit,
  // or the host no longer enforces quotas.
  DRIFT_KIND_DISK_QUOTA_DRIFT = 21;
}

message Drift {
  DriftKind kind = 1;
  // Tenant name, domain, or file path the finding is about.
  string subject = 2;
  string detail = 3;
}

message ReconcileResponse {
  // Empty when records and operating system agree.
  repeated Drift drifts = 1;
}

enum LogKind {
  // Treated as ACCESS.
  LOG_KIND_UNSPECIFIED = 0;
  LOG_KIND_ACCESS = 1;
  LOG_KIND_ERROR = 2;
  // Output of the virtual host's application (stdout and stderr, from the
  // journal), most recent lines last. INVALID_ARGUMENT if it runs none.
  LOG_KIND_APP = 3;
}

message ReadVirtualHostLogRequest {
  string domain = 1;
  LogKind kind = 2;
  // How much of the end of the log to return. 0 = 32 KiB; at most 128 KiB.
  uint32 max_bytes = 3;
}

message ReadVirtualHostLogResponse {
  // Whole lines from the end of the current log file (not rotated ones).
  string text = 1;
  // true when the file holds more than was returned.
  bool truncated = 2;
}

message RestartAppRequest {
  string domain = 1;
}

message RestartAppResponse {}

message InstallAppDependenciesRequest {
  string domain = 1;
}

message InstallAppDependenciesResponse {
  // false when the installer exited with an error; `output` says why.
  bool succeeded = 1;
  // The end of the installer's output.
  string output = 2;
}

enum CertificateSource {
  CERTIFICATE_SOURCE_UNSPECIFIED = 0;
  // Installed with InstallCertificate.
  CERTIFICATE_SOURCE_UPLOADED = 1;
  // Obtained with RequestCertificate; renewed automatically.
  CERTIFICATE_SOURCE_ACME = 2;
}

// What is known about a virtual host's certificate. The private key is never
// part of any response.
message Certificate {
  CertificateSource source = 1;
  // Issuer distinguished name, e.g. "CN=R11,O=Let's Encrypt,C=US".
  string issuer = 2;
  google.protobuf.Timestamp not_before = 3;
  google.protobuf.Timestamp not_after = 4;
  // DNS names the certificate is valid for (may contain wildcards).
  repeated string names = 5;
  // Server names of the virtual host the certificate does NOT cover;
  // browsers will show a warning for these.
  repeated string uncovered_names = 6;
  google.protobuf.Timestamp installed_at = 7;
}

message InstallCertificateRequest {
  string domain = 1;
  // PEM: the certificate for the domain first, then its intermediates.
  string certificate_chain_pem = 2;
  // PEM, unencrypted (PKCS#8, RSA or EC). Never logged, never returned.
  string private_key_pem = 3;
}

message InstallCertificateResponse {
  VirtualHost vhost = 1;
  // false when exactly this certificate and key were already installed.
  bool changed = 2;
}

message RemoveCertificateRequest {
  string domain = 1;
}

message RemoveCertificateResponse {
  VirtualHost vhost = 1;
  // false when the virtual host had no certificate.
  bool removed = 2;
}

message RequestCertificateRequest {
  string domain = 1;
}

message RequestCertificateResponse {
  // false when the certificate authority did not issue; `output` says why.
  bool succeeded = 1;
  // What the ACME client reported.
  string output = 2;
  VirtualHost vhost = 3;
}

message RenewCertificatesRequest {}

message CertificateRenewal {
  string domain = 1;
  bool succeeded = 2;
  string output = 3;
}

message RenewCertificatesResponse {
  // One entry per certificate that was due; empty when none was.
  repeated CertificateRenewal renewals = 1;
}

enum AutoHttpsState {
  AUTO_HTTPS_STATE_UNSPECIFIED = 0;
  // Off for the host, or the site opted out.
  AUTO_HTTPS_STATE_DISABLED = 1;
  // Names are waiting for their first attempt (or one is running).
  AUTO_HTTPS_STATE_PENDING = 2;
  // Every name of the site is covered by an automatic certificate.
  AUTO_HTTPS_STATE_COVERED = 3;
  // The domain is covered; some aliases were skipped and are retried later.
  AUTO_HTTPS_STATE_PARTIAL = 4;
  // No certificate could be obtained yet; retried later (see next_attempt).
  AUTO_HTTPS_STATE_FAILED = 5;
  // The site has a valid uploaded certificate, which is never replaced.
  AUTO_HTTPS_STATE_UPLOADED = 6;
  // The tenant is suspended; nothing is requested until it is resumed.
  AUTO_HTTPS_STATE_SUSPENDED = 7;
}

message AutoHttpsSkippedName {
  string name = 1;
  // Why, in plain words (e.g. "the name does not resolve").
  string reason = 2;
  google.protobuf.Timestamp next_attempt = 3;
  // Consecutive failures; the wait grows 1 h, 6 h, then 24 h.
  uint32 failures = 4;
}

message AutoHttpsStatus {
  string domain = 1;
  AutoHttpsState state = 2;
  // Server names the current certificate covers.
  repeated string covered_names = 3;
  // Server names left out after failing, waiting for their next attempt.
  repeated AutoHttpsSkippedName skipped = 4;
  google.protobuf.Timestamp last_attempt = 5;
  // Earliest time anything will be tried again; absent if nothing is waiting.
  google.protobuf.Timestamp next_attempt = 6;
  // What went wrong last time, in plain words; empty after a success.
  string last_error = 7;
  // Server names not covered yet and not backing off: tried at the next run.
  repeated string pending_names = 8;
}

message RunAutoHttpsRequest {
  // Empty: every site.
  string domain = 1;
}

message RunAutoHttpsResponse {
  repeated AutoHttpsStatus sites = 1;
}

message GetAutoHttpsStatusRequest {
  // Empty: every site.
  string domain = 1;
}

message GetAutoHttpsStatusResponse {
  repeated AutoHttpsStatus sites = 1;
}

// An SSH public key that may log in over SFTP as a tenant. All of it is public.
message SftpKey {
  // "SHA256:…" as `ssh-keygen -l` prints it; identifies the key.
  string fingerprint = 1;
  // e.g. "ssh-ed25519".
  string key_type = 2;
  // The key in authorized_keys form: "<type> <base64>" (no comment).
  string public_key = 3;
  string label = 4;
  google.protobuf.Timestamp added_at = 5;
}

message AddSftpKeyRequest {
  string username = 1;
  // One line as in an id_*.pub file: "<type> <base64> [comment]". Accepted
  // types: ssh-ed25519, ecdsa-sha2-nistp256/384/521, ssh-rsa (2048..=16384
  // bits), sk-ssh-ed25519@openssh.com, sk-ecdsa-sha2-nistp256@openssh.com.
  // Key options (command=, from=, …) are refused: the engine sets them.
  string public_key = 2;
  // ^[A-Za-z0-9@._+-]{1,64}$ or empty (= the key's own comment, if it is
  // such a string).
  string label = 3;
}

message AddSftpKeyResponse {
  SftpKey key = 1;
  // false when the tenant already had this key with this label.
  bool changed = 2;
}

message RemoveSftpKeyRequest {
  string username = 1;
  string fingerprint = 2;
  // Also end the tenant's running SFTP sessions (all of them: sshd cannot
  // tell which credential a session used). Default: they continue.
  bool end_sessions = 3;
}

message RemoveSftpKeyResponse {
  // Keys the tenant still has.
  uint32 remaining = 1;
}

message ListSftpKeysRequest {
  string username = 1;
}

message ListSftpKeysResponse {
  // Oldest first.
  repeated SftpKey keys = 1;
}

message SetSftpPasswordRequest {
  string username = 1;
  // 12..=256 characters, no control characters. Further policy (strength,
  // reuse) is the panel's. Never logged, never in an argv, never returned.
  string password = 2;
}

message SetSftpPasswordResponse {
  Tenant tenant = 1;
}

message ClearSftpPasswordRequest {
  string username = 1;
  // Also end the tenant's running SFTP sessions. Default: they continue.
  bool end_sessions = 2;
}

message ClearSftpPasswordResponse {
  // false when the tenant had no SFTP password.
  bool cleared = 1;
  Tenant tenant = 2;
}
