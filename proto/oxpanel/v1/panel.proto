syntax = "proto3";

package oxpanel.v1;

import "google/protobuf/timestamp.proto";

// OxPanelEngine is the privileged system engine of OxPanel.
//
// It is reachable ONLY over a local UNIX-domain socket. Every call is
// authenticated by the kernel-supplied peer credentials (SO_PEERCRED) of the
// connecting process against a configured allow-list; there is no in-band
// authentication and no network transport.
//
// All operations are idempotent: repeating a request with identical arguments
// after a success returns the same result and `created`/`deleted` = false.
service OxPanelEngine {
  // Provision an isolated POSIX tenant: a dedicated user + primary group,
  // a mode-0700 home directory, and a systemd slice carrying its resource limits.
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  // Remove a tenant that OxPanel created. Refuses to touch users it does not manage.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);

  // Create or update an Nginx server block for a domain owned by a tenant.
  // The configuration is validated with `nginx -t` before it is activated and
  // rolled back if validation fails.
  rpc ConfigureVirtualHost(ConfigureVirtualHostRequest) returns (ConfigureVirtualHostResponse);
  rpc RemoveVirtualHost(RemoveVirtualHostRequest) returns (RemoveVirtualHostResponse);
  rpc ListVirtualHosts(ListVirtualHostsRequest) returns (ListVirtualHostsResponse);
  // Restart a virtual host's application (after new code was put in place).
  rpc RestartApp(RestartAppRequest) returns (RestartAppResponse);
  // Install the application's dependencies as the tenant: `npm install` for
  // Node.js, `pip install -r requirements.txt` into the app's virtualenv for
  // Python. The application is restarted when the installation succeeds.
  rpc InstallAppDependencies(InstallAppDependenciesRequest) returns (InstallAppDependenciesResponse);
  // The end of a virtual host's access or error log.
  rpc ReadVirtualHostLog(ReadVirtualHostLogRequest) returns (ReadVirtualHostLogResponse);

  // Replace a tenant's resource limits. Applied through systemd immediately.
  rpc UpdateTenantLimits(UpdateTenantLimitsRequest) returns (UpdateTenantResponse);
  // Replace a tenant's owner label (e.g. move it to another reseller).
  rpc UpdateTenantOwner(UpdateTenantOwnerRequest) returns (UpdateTenantResponse);
  // Suspend a tenant: every virtual host it owns answers 503 until resumed.
  // Files, limits and the account are left untouched.
  rpc SuspendTenant(SuspendTenantRequest) returns (UpdateTenantResponse);
  rpc ResumeTenant(ResumeTenantRequest) returns (UpdateTenantResponse);
  // Current resource consumption of one tenant.
  rpc GetTenantUsage(GetTenantUsageRequest) returns (TenantUsage);

  // Engine version, capacity and host load.
  rpc GetHostInfo(GetHostInfoRequest) returns (HostInfo);
  // Compare every record with the operating system and report differences.
  // Read-only: nothing is repaired.
  rpc Reconcile(ReconcileRequest) returns (ReconcileResponse);

  // Install a certificate chain and its private key for a virtual host
  // ("bring your own certificate"); the site is then also served on port 443.
  // The key must match the certificate, the certificate must cover the
  // virtual host's domain and be within its validity period.
  rpc InstallCertificate(InstallCertificateRequest) returns (InstallCertificateResponse);
  // Remove a virtual host's certificate and key; the site is HTTP-only again.
  rpc RemoveCertificate(RemoveCertificateRequest) returns (RemoveCertificateResponse);
  // Obtain (or renew now) a certificate for the virtual host's domain and
  // aliases from the configured ACME certificate authority (HTTP-01).
  // May take a minute or two.
  rpc RequestCertificate(RequestCertificateRequest) returns (RequestCertificateResponse);
  // Renew every ACME certificate that is due. The engine also does this by
  // itself twice a day.
  rpc RenewCertificates(RenewCertificatesRequest) returns (RenewCertificatesResponse);
  // Automatic HTTPS: obtain certificates for sites now instead of waiting for
  // the engine's own schedule. With a domain: that site, ignoring back-off.
  // Without: every site, respecting back-off. May take minutes.
  rpc RunAutoHttps(RunAutoHttpsRequest) returns (RunAutoHttpsResponse);
  // Automatic HTTPS: what it has done and will do for one or all sites.
  rpc GetAutoHttpsStatus(GetAutoHttpsStatusRequest) returns (GetAutoHttpsStatusResponse);
  // SFTP access. A tenant with at least one key can log in over SFTP — SFTP
  // only (no shell, no forwarding of any kind), confined to its own home.
  // Adding a key the tenant already has changes nothing but its label.
  // FAILED_PRECONDITION if sshd is missing or would not confine the tenant.
  rpc AddSftpKey(AddSftpKeyRequest) returns (AddSftpKeyResponse);
  // Remove one key: it cannot start a new session. Running sessions continue
  // unless `end_sessions` is set. Removing the last key (with no password
  // either) removes SFTP access altogether. NOT_FOUND if the tenant has no
  // such key.
  rpc RemoveSftpKey(RemoveSftpKeyRequest) returns (RemoveSftpKeyResponse);
  rpc ListSftpKeys(ListSftpKeysRequest) returns (ListSftpKeysResponse);
  // Give the tenant an SFTP password, or replace it. Same confinement as a
  // key (SFTP only, chrooted, no forwarding). Stored only as the system's
  // password hash; never returned. FAILED_PRECONDITION if the host forbids
  // SFTP passwords (HostInfo.sftp_passwords_allowed) or cannot confine the
  // tenant.
  rpc SetSftpPassword(SetSftpPasswordRequest) returns (SetSftpPasswordResponse);
  // Remove the tenant's SFTP password: it cannot start a new session.
  // Running sessions continue unless `end_sessions` is set.
  rpc ClearSftpPassword(ClearSftpPasswordRequest) returns (ClearSftpPasswordResponse);
  // --- Databases ----------------------------------------------------------
  // Databases and database users are named "<tenant>_<suffix>" and live on
  // one engine (DatabaseEngine; today only MariaDB). Names are unique across
  // engines, so every call after creation addresses an object by name alone.
  // FAILED_PRECONDITION on every call below (except the lists) when the
  // engine is not installed, not running or not reachable on its UNIX socket.
  //
  // Create a database owned by a tenant.
  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse);
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);
  // Drop a database OxPanel created, with everything in it.
  rpc DeleteDatabase(DeleteDatabaseRequest) returns (DeleteDatabaseResponse);
  // Create a database user owned by a tenant. It may connect only locally
  // and holds no privileges until it is granted a database.
  rpc CreateDatabaseUser(CreateDatabaseUserRequest) returns (CreateDatabaseUserResponse);
  rpc ListDatabaseUsers(ListDatabaseUsersRequest) returns (ListDatabaseUsersResponse);
  rpc SetDatabaseUserPassword(SetDatabaseUserPasswordRequest) returns (SetDatabaseUserPasswordResponse);
  rpc DeleteDatabaseUser(DeleteDatabaseUserRequest) returns (DeleteDatabaseUserResponse);
  // Let a tenant's user work in a database of the same tenant.
  rpc GrantDatabaseAccess(GrantDatabaseAccessRequest) returns (GrantDatabaseAccessResponse);
  rpc RevokeDatabaseAccess(RevokeDatabaseAccessRequest) returns (RevokeDatabaseAccessResponse);
  // Start a backup of a tenant (its home, plus the engine's records of the
  // tenant and its virtual hosts). Returns at once with a job; the work runs
  // outside the request and survives a restart of the engine. While a backup
  // of the tenant is already running, that job is returned instead of a
  // second one being started.
  rpc CreateBackup(CreateBackupRequest) returns (StartJobResponse);
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse);
  // Restore a tenant's files from one of that tenant's own backups into its
  // home. The caller must choose what happens to files that already exist
  // (`on_existing`, no default); files that are not in the backup are always
  // kept. PHP and applications of the tenant are stopped for the duration;
  // applications get their virtualenv and dependencies reinstalled (backups
  // leave them out) before they start again. Returns at once with a job.
  rpc RestoreBackup(RestoreBackupRequest) returns (StartJobResponse);
  // State of a backup or restore job.
  rpc GetJob(GetJobRequest) returns (Job);
  // Keep one of a tenant's complete backups for 1 to 12 months from now,
  // whatever the per-tenant retention count says and also after the tenant
  // is deleted; then the engine removes it. Repeating it sets a new date.
  rpc RetainBackup(RetainBackupRequest) returns (Backup);
  // Every backup with a retention date, including those of deleted tenants.
  rpc ListRetainedBackups(ListRetainedBackupsRequest) returns (ListBackupsResponse);
  // Operator action: restore a retained backup of a DELETED tenant into an
  // existing tenant (e.g. the customer's re-created account). Needs the
  // backup id, the name of the tenant it was taken from and the target.
  // The ordinary RestoreBackup never reaches such a backup.
  rpc RestoreRetainedBackup(RestoreRetainedBackupRequest) returns (StartJobResponse);
  // --- DNS hosting ----------------------------------------------------------
  // This host as the authoritative DNS server of its tenants' domains (see
  // HostInfo.dns). A zone belongs to exactly one tenant; every request that
  // names a zone also names the tenant, and another tenant's zone is
  // NOT_FOUND. FAILED_PRECONDITION on every call below except the reads
  // when DNS hosting is off or the DNS server is not installed.
  //
  // Create a zone explicitly (sites get one by themselves). The zone may not
  // be a public suffix, overlap another zone, or contain another tenant's
  // sites.
  rpc CreateDnsZone(CreateDnsZoneRequest) returns (CreateDnsZoneResponse);
  rpc ListDnsZones(ListDnsZonesRequest) returns (ListDnsZonesResponse);
  // One zone with every record, the engine's own (protected) included, and
  // its DNSSEC state with the DS records for the registrar.
  rpc GetDnsZone(GetDnsZoneRequest) returns (DnsZone);
  // Delete a zone with all its records. The DNS server stops answering for it.
  rpc DeleteDnsZone(DeleteDnsZoneRequest) returns (DeleteDnsZoneResponse);
  // Add a record. Adding a record the zone already has changes nothing.
  rpc AddDnsRecord(AddDnsRecordRequest) returns (DnsRecordResponse);
  // Replace a record (by id) with new contents.
  rpc UpdateDnsRecord(UpdateDnsRecordRequest) returns (DnsRecordResponse);
  rpc RemoveDnsRecord(RemoveDnsRecordRequest) returns (RemoveDnsRecordResponse);
  // Remove every record the tenant added; the engine's records stay.
  rpc ResetDnsZone(ResetDnsZoneRequest) returns (DnsZone);
  // Look at the zone from outside (through an unprivileged helper, the
  // engine has no network): is the domain delegated to this host's name
  // servers, is a DS record published at the parent, and which serial does
  // each name server serve. Takes a few seconds.
  rpc CheckDnsZone(CheckDnsZoneRequest) returns (DnsZoneCheck);
  // Switch DNSSEC signing of a zone on or off. Switching it off is refused
  // while the parent still publishes a DS record for the zone (the domain
  // would stop resolving for validating resolvers) and, unless `force` is
  // set, when that cannot be checked.
  rpc SetDnssec(SetDnssecRequest) returns (DnsZone);
}

// Per-tenant resource limits, applied through systemd (cgroups v2).
// A zero value means "leave the systemd default".
message ResourceLimits {
  // systemd MemoryMax= in bytes. 0 = unlimited.
  uint64 memory_max_bytes = 1;
  // systemd CPUWeight=, 1..=10000. 0 = default (100).
  uint32 cpu_weight = 2;
  // systemd IOWeight=, 1..=10000. 0 = default (100).
  uint32 io_weight = 3;
  // systemd TasksMax=. 0 = default.
  uint32 tasks_max = 4;
  // Disk space the tenant's files may occupy on the file system holding the
  // homes, enforced by the kernel (XFS user quota): a write beyond it fails.
  // 0 = unlimited; otherwise at least 1 MiB (rounded down to whole KiB).
  // FAILED_PRECONDITION if the host does not enforce quotas (see
  // HostInfo.disk_quota_available).
  uint64 disk_max_bytes = 5;
  // Number of files and directories the tenant may own there. 0 = unlimited;
  // otherwise at least 100. Same precondition as disk_max_bytes.
  uint64 inodes_max = 6;
}

message Tenant {
  string username = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  string home = 4;
  ResourceLimits limits = 5;
  // Name of the systemd slice unit that carries the limits, e.g. "oxpanel-tenant-alice.slice".
  string slice_unit = 6;
  google.protobuf.Timestamp created_at = 7;
  TenantState state = 8;
  // Opaque label of the owning account in the panel (e.g. a reseller id).
  // The engine stores and filters by it; it carries no OS meaning.
  string owner = 9;
  // True while the tenant is suspended (its sites answer 503).
  bool suspended = 10;
  // Number of SSH keys that may log in over SFTP.
  uint32 sftp_key_count = 11;
  // The tenant has an SFTP password. (SFTP access: a key or a password.)
  bool sftp_password = 12;
}

enum TenantState {
  TENANT_STATE_UNSPECIFIED = 0;
  // useradd succeeded but post-provisioning steps (limits, labels) are not
  // all confirmed. A repeated CreateTenant call resumes them.
  TENANT_STATE_PROVISIONING = 1;
  TENANT_STATE_READY = 2;
  // DeleteTenant in progress; a repeated call resumes it.
  TENANT_STATE_DELETING = 3;
}

message CreateTenantRequest {
  // 3..=32 chars, ^[a-z][a-z0-9_-]*$; reserved system names are rejected.
  string username = 1;
  ResourceLimits limits = 2;
  // Optional owner label: ^[a-z0-9][a-z0-9_.-]{0,63}$ or empty. Part of the
  // tenant specification for idempotency purposes.
  string owner = 3;
}

message CreateTenantResponse {
  Tenant tenant = 1;
  // false when the tenant already existed with an identical specification.
  bool created = 2;
}

message GetTenantRequest {
  string username = 1;
}

message ListTenantsRequest {
  // Empty = all tenants; otherwise only tenants with this owner label.
  string owner = 1;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
}

message DeleteTenantRequest {
  string username = 1;
  // Also delete the home directory. Default: keep it.
  bool remove_home = 2;
}

message DeleteTenantResponse {
  // false when the tenant did not exist.
  bool deleted = 1;
}

message VirtualHost {
  string domain = 1;
  string tenant = 2;
  // Path relative to the tenant home, e.g. "public_html".
  string document_root = 3;
  repeated string aliases = 4;
  // Absolute path of the generated Nginx configuration file.
  string config_path = 5;
  // PHP is enabled: *.php is executed by the tenant's own PHP-FPM pool.
  bool php = 6;
  // Set when the virtual host runs an application.
  App app = 7;
  // The installed certificate; absent when the site is HTTP-only.
  Certificate certificate = 8;
  // As requested; they take effect only while a certificate is installed.
  bool redirect_https = 9;
  bool hsts = 10;
  // The site is excluded from Automatic HTTPS (see GetAutoHttpsStatus).
  bool auto_https_opt_out = 11;
  // DNS hosting: the site's names get no records from the engine.
  bool dns_opt_out = 12;
  // DNS hosting: the zone on this host that holds the address records of the
  // site's domain; empty when there is none (DNS hosting off, the site opted
  // out, or the name is inside another tenant's zone).
  string dns_zone = 13;
}

enum AppRuntime {
  APP_RUNTIME_UNSPECIFIED = 0;
  // `node <entry>`
  APP_RUNTIME_NODE = 1;
  // `<root>/.venv/bin/python <entry>`; the virtualenv is created for the app.
  APP_RUNTIME_PYTHON = 2;
}

// A long-running application behind a virtual host. It runs as the tenant in
// its own sandboxed service inside the tenant's slice and must listen on the
// UNIX socket whose path it receives in the PORT (and OXPANEL_SOCKET)
// environment variable. Nginx serves files that exist in the document root
// itself and passes every other request to the application.
message App {
  AppRuntime runtime = 1;
  // Application directory relative to the tenant home; created (owned by the
  // tenant) if absent. Empty = "apps/<domain>". Not readable by the web server.
  string root = 2;
  // Program to run, relative to `root`. Empty = "app.js" / "app.py".
  string entry = 3;
}

message ConfigureVirtualHostRequest {
  // Fully-qualified host name, lower-case ASCII (IDNA A-label / punycode allowed).
  string domain = 1;
  // Username of an OxPanel-managed tenant that owns the domain.
  string tenant = 2;
  // Path relative to the tenant home; created (owned by the tenant) if absent.
  // Empty = "public_html".
  string document_root = 3;
  // Additional server_name entries, each validated like `domain`.
  repeated string aliases = 4;
  // Execute *.php through the tenant's PHP-FPM pool. The pool runs as the
  // tenant, inside the tenant's slice, and is created on first use and
  // removed with the tenant's last PHP-enabled virtual host.
  // FAILED_PRECONDITION if PHP-FPM is not installed on the host.
  bool php = 5;
  // Run an application behind this virtual host. Cannot be combined with
  // `php`. FAILED_PRECONDITION if the runtime is not installed on the host.
  App app = 6;
  // Answer plain-HTTP requests with a redirect to HTTPS. Takes effect only
  // while a certificate is installed (ACME challenges are still answered
  // over HTTP).
  bool redirect_https = 7;
  // Send `Strict-Transport-Security: max-age=31536000` over HTTPS. Browsers
  // remember it for a year: enable it only once HTTPS is there to stay.
  // Takes effect only while a certificate is installed.
  bool hsts = 8;
  // Exclude this site from Automatic HTTPS. Default (false): when Automatic
  // HTTPS is on for the host, the site gets a certificate by itself.
  bool auto_https_opt_out = 9;
  // Keep the site's names out of DNS hosting (its domain's DNS is hosted
  // elsewhere). Default (false): when DNS hosting is on, the site's names
  // get address records pointing at this host, in a zone created for the
  // registrable domain if the tenant has none covering them yet.
  bool dns_opt_out = 10;
}

message ConfigureVirtualHostResponse {
  VirtualHost vhost = 1;
  // false when an identical configuration was already active.
  bool created = 2;
}

message RemoveVirtualHostRequest {
  string domain = 1;
}

message RemoveVirtualHostResponse {
  // false when no such virtual host existed.
  bool removed = 1;
}

message ListVirtualHostsRequest {
  // Empty = all tenants.
  string tenant = 1;
}

message ListVirtualHostsResponse {
  repeated VirtualHost vhosts = 1;
}

message UpdateTenantLimitsRequest {
  string username = 1;
  // The complete new set of limits (not a patch). Absent = no limits.
  ResourceLimits limits = 2;
}

message UpdateTenantOwnerRequest {
  string username = 1;
  // New owner label; empty clears it.
  string owner = 2;
}

message SuspendTenantRequest {
  string username = 1;
}

message ResumeTenantRequest {
  string username = 1;
}

message UpdateTenantResponse {
  Tenant tenant = 1;
  // false when the tenant already had exactly this value.
  bool changed = 2;
}

message GetTenantUsageRequest {
  string username = 1;
}

// A point-in-time measurement. Memory, CPU and tasks cover the tenant slice
// and the tenant's login-session slice together; 0 when nothing is running.
message TenantUsage {
  string username = 1;
  uint64 memory_current_bytes = 2;
  // Total CPU time consumed since the slices were started.
  uint64 cpu_usage_nsec = 3;
  uint64 tasks_current = 4;
  // Disk space in use. Where disk quotas are enforced this is the quota
  // system's figure (everything the tenant's uid owns on the file system
  // holding the homes); elsewhere, the space allocated under the home.
  uint64 disk_usage_bytes = 5;
  google.protobuf.Timestamp measured_at = 6;
}

message GetHostInfoRequest {}

message HostInfo {
  string daemon_version = 1;
  bool selinux_enabled = 2;
  bool dry_run = 3;
  uint32 tenant_count = 4;
  uint32 vhost_count = 5;
  // Inclusive uid range tenants are allocated from (capacity = max - min + 1).
  uint32 uid_min = 6;
  uint32 uid_max = 7;
  double load_1m = 8;
  double load_5m = 9;
  double load_15m = 10;
  uint64 memory_total_bytes = 11;
  uint64 memory_free_bytes = 12;
  // The file system that holds tenant homes.
  uint64 home_disk_total_bytes = 13;
  uint64 home_disk_free_bytes = 14;
  uint64 uptime_seconds = 15;
  // PHP-FPM is installed, so virtual hosts may enable `php`.
  bool php_available = 16;
  // Node.js (version 22 or newer) / Python are installed, so virtual hosts
  // may run such applications.
  bool node_available = 17;
  bool python_available = 18;
  // Installed Node.js version, e.g. "22.11.0"; empty if none. A version
  // older than 22 is reported here while `node_available` stays false.
  string node_version = 19;
  // The file system that holds backups (0 if the directory does not exist).
  uint64 backup_disk_total_bytes = 32;
  uint64 backup_disk_free_bytes = 33;
  // Backups kept per tenant; older ones are removed when a new one completes.
  uint32 backup_keep = 34;
  // OpenSSL is installed, so certificates can be installed.
  bool tls_available = 20;
  // The ACME client, its account and its directories are in place, so
  // certificates can be requested.
  bool acme_available = 21;
  // The ACME directory certificates are requested from.
  string acme_directory_url = 22;
  // Automatic HTTPS is switched on for the host (OXPANEL_AUTO_HTTPS).
  bool auto_https_enabled = 23;
  // sshd is installed and OxPanel's drop-in is in place, so tenants can be
  // given SFTP access.
  bool sftp_available = 24;
  // The file system holding tenant homes enforces user quotas, so tenants
  // can be given disk limits.
  bool disk_quota_available = 25;
  // What was found about quotas, and when they are not available, what the
  // operator has to change.
  string disk_quota_detail = 26;
  // Tenants may be given SFTP passwords (OXPANEL_SFTP_PASSWORDS, default
  // true). When false, SetSftpPassword is refused and sshd offers password
  // authentication to no tenant.
  bool sftp_passwords_allowed = 27;
  // One entry per database engine the engine supports (today: MariaDB),
  // whether or not it is installed.
  repeated DatabaseEngineInfo database_engines = 28;
  // 29..=31 were set aside for databases and are still unused.
  // DNS hosting: configuration and state.
  DnsHostInfo dns = 35;
}

// Database engines OxPanel can manage. More will follow (PostgreSQL,
// MongoDB); each is an optional host package.
enum DatabaseEngine {
  // In a request: the default engine, MariaDB.
  DATABASE_ENGINE_UNSPECIFIED = 0;
  DATABASE_ENGINE_MARIADB = 1;
}

message DatabaseEngineInfo {
  DatabaseEngine engine = 1;
  // Installed and answering on its UNIX socket, so tenants may have
  // databases on it.
  bool available = 2;
  // Server version, e.g. "10.5.29-MariaDB"; empty when not available.
  string version = 3;
  uint32 database_count = 4;
  uint32 database_user_count = 5;
}

message ReconcileRequest {}

enum DriftKind {
  DRIFT_KIND_UNSPECIFIED = 0;
  // A tenant record is not in state READY (interrupted create or delete).
  DRIFT_KIND_TENANT_INCOMPLETE = 1;
  // The record exists but the POSIX account does not.
  DRIFT_KIND_TENANT_ACCOUNT_MISSING = 2;
  // uid, gid or home of the account differ from the record.
  DRIFT_KIND_TENANT_ACCOUNT_MISMATCH = 3;
  // The home is missing, not a directory, wrongly owned or open to others.
  DRIFT_KIND_TENANT_HOME_INVALID = 4;
  // A slice unit or drop-in is missing or differs from the recorded limits.
  DRIFT_KIND_TENANT_UNIT_DRIFT = 5;
  // A virtual host names a tenant that has no record.
  DRIFT_KIND_VHOST_TENANT_MISSING = 6;
  // The Nginx file is missing or differs from what the record renders to.
  DRIFT_KIND_VHOST_CONFIG_DRIFT = 7;
  // A file in the OxPanel Nginx directory that no record accounts for.
  DRIFT_KIND_ORPHAN_NGINX_CONFIG = 8;
  // An oxpanel-tenant-*.slice unit that no record accounts for.
  DRIFT_KIND_ORPHAN_SLICE_UNIT = 9;
  // A tenant's PHP-FPM pool configuration or service unit is missing or
  // differs from what the records render to.
  DRIFT_KIND_PHP_POOL_DRIFT = 10;
  // A PHP-FPM pool file or unit that no PHP-enabled virtual host accounts for.
  DRIFT_KIND_ORPHAN_PHP_POOL = 11;
  // An application's service unit is missing or differs from its record.
  DRIFT_KIND_APP_UNIT_DRIFT = 12;
  // An oxpanel-app-*.service unit that no virtual host accounts for.
  DRIFT_KIND_ORPHAN_APP_UNIT = 13;
  // A virtual host's certificate file is missing or differs from the record,
  // or its private key is missing or readable by others.
  DRIFT_KIND_TLS_CERTIFICATE_DRIFT = 14;
  // A file in the OxPanel certificate directory that no virtual host accounts for.
  DRIFT_KIND_ORPHAN_TLS_FILE = 15;
  // Automatic HTTPS state kept for a virtual host that does not exist.
  DRIFT_KIND_ORPHAN_AUTO_HTTPS_STATE = 16;
  // A tenant's SFTP keys file or home mount unit is missing or differs from
  // the record, or the account is not in the tenant group.
  DRIFT_KIND_SFTP_ACCESS_DRIFT = 18;
  // A keys file, mount unit or chroot directory that no tenant accounts for.
  DRIFT_KIND_ORPHAN_SFTP_ACCESS = 19;
  // OxPanel's sshd drop-in is missing or edited.
  DRIFT_KIND_SSHD_CONFIG_DRIFT = 20;
  // The kernel's disk quota for a tenant differs from its recorded limit,
  // or the host no longer enforces quotas.
  DRIFT_KIND_DISK_QUOTA_DRIFT = 21;
  // A recorded database does not exist on the MariaDB server, its record is
  // in an interrupted state, or the server could not be asked.
  DRIFT_KIND_DATABASE_MISSING = 22;
  // A recorded database user does not exist on the server, or its record is
  // in an interrupted state.
  DRIFT_KIND_DATABASE_USER_MISSING = 23;
  // A database user's privileges, lock state, connection limit or
  // authentication differ from its record (for example a privilege granted
  // by hand), or an account OxPanel does not manage holds privileges on a
  // managed database.
  DRIFT_KIND_DATABASE_PRIVILEGE_DRIFT = 24;
  // A database or account on the server that carries a tenant's prefix but
  // has no record.
  DRIFT_KIND_ORPHAN_DATABASE_OBJECT = 25;
  // A backup record whose directory, manifest or a member is missing.
  DRIFT_KIND_BACKUP_ARCHIVE_MISSING = 26;
  // A member of a backup no longer has its recorded size, or the manifest
  // differs from the record. (Checksums are verified at restore, not here.)
  DRIFT_KIND_BACKUP_ARCHIVE_MODIFIED = 27;
  // A directory in the backup store that no backup record accounts for.
  DRIFT_KIND_ORPHAN_BACKUP_ARCHIVE = 28;
  // A backup that was never completed and has no running job, or a job
  // recorded as running whose backup or tenant is gone.
  DRIFT_KIND_BACKUP_INCOMPLETE = 29;
  // DNS: a zone file that is missing or differs from what the records
  // render, or a zone the DNS server does not serve at the recorded serial.
  DRIFT_KIND_DNS_ZONE_DRIFT = 30;
  // DNS: a file in OxPanel's DNS directories that no zone record accounts for.
  DRIFT_KIND_ORPHAN_DNS_FILE = 31;
  // DNS: OxPanel's DNS server configuration differs from what it renders,
  // or the DNS server is not running while DNS hosting is on.
  DRIFT_KIND_DNS_SERVER_DRIFT = 32;
  // DNS: a secondary name server serves an older serial than the primary,
  // or does not serve the zone at all.
  DRIFT_KIND_DNS_SECONDARY_DRIFT = 33;
  // DNSSEC: a signed zone without signing keys, or keys left behind for a
  // zone that is not signed.
  DRIFT_KIND_DNSSEC_DRIFT = 34;
}

message Drift {
  DriftKind kind = 1;
  // Tenant name, domain, or file path the finding is about.
  string subject = 2;
  string detail = 3;
}

message ReconcileResponse {
  // Empty when records and operating system agree.
  repeated Drift drifts = 1;
}

enum LogKind {
  // Treated as ACCESS.
  LOG_KIND_UNSPECIFIED = 0;
  LOG_KIND_ACCESS = 1;
  LOG_KIND_ERROR = 2;
  // Output of the virtual host's application (stdout and stderr, from the
  // journal), most recent lines last. INVALID_ARGUMENT if it runs none.
  LOG_KIND_APP = 3;
}

message ReadVirtualHostLogRequest {
  string domain = 1;
  LogKind kind = 2;
  // How much of the end of the log to return. 0 = 32 KiB; at most 128 KiB.
  uint32 max_bytes = 3;
}

message ReadVirtualHostLogResponse {
  // Whole lines from the end of the current log file (not rotated ones).
  string text = 1;
  // true when the file holds more than was returned.
  bool truncated = 2;
}

message RestartAppRequest {
  string domain = 1;
}

message RestartAppResponse {}

message InstallAppDependenciesRequest {
  string domain = 1;
}

message InstallAppDependenciesResponse {
  // false when the installer exited with an error; `output` says why.
  bool succeeded = 1;
  // The end of the installer's output.
  string output = 2;
}

enum CertificateSource {
  CERTIFICATE_SOURCE_UNSPECIFIED = 0;
  // Installed with InstallCertificate.
  CERTIFICATE_SOURCE_UPLOADED = 1;
  // Obtained with RequestCertificate; renewed automatically.
  CERTIFICATE_SOURCE_ACME = 2;
}

// What is known about a virtual host's certificate. The private key is never
// part of any response.
message Certificate {
  CertificateSource source = 1;
  // Issuer distinguished name, e.g. "CN=R11,O=Let's Encrypt,C=US".
  string issuer = 2;
  google.protobuf.Timestamp not_before = 3;
  google.protobuf.Timestamp not_after = 4;
  // DNS names the certificate is valid for (may contain wildcards).
  repeated string names = 5;
  // Server names of the virtual host the certificate does NOT cover;
  // browsers will show a warning for these.
  repeated string uncovered_names = 6;
  google.protobuf.Timestamp installed_at = 7;
}

message InstallCertificateRequest {
  string domain = 1;
  // PEM: the certificate for the domain first, then its intermediates.
  string certificate_chain_pem = 2;
  // PEM, unencrypted (PKCS#8, RSA or EC). Never logged, never returned.
  string private_key_pem = 3;
}

message InstallCertificateResponse {
  VirtualHost vhost = 1;
  // false when exactly this certificate and key were already installed.
  bool changed = 2;
}

message RemoveCertificateRequest {
  string domain = 1;
}

message RemoveCertificateResponse {
  VirtualHost vhost = 1;
  // false when the virtual host had no certificate.
  bool removed = 2;
}

message RequestCertificateRequest {
  string domain = 1;
}

message RequestCertificateResponse {
  // false when the certificate authority did not issue; `output` says why.
  bool succeeded = 1;
  // What the ACME client reported.
  string output = 2;
  VirtualHost vhost = 3;
}

message RenewCertificatesRequest {}

message CertificateRenewal {
  string domain = 1;
  bool succeeded = 2;
  string output = 3;
}

message RenewCertificatesResponse {
  // One entry per certificate that was due; empty when none was.
  repeated CertificateRenewal renewals = 1;
}

enum AutoHttpsState {
  AUTO_HTTPS_STATE_UNSPECIFIED = 0;
  // Off for the host, or the site opted out.
  AUTO_HTTPS_STATE_DISABLED = 1;
  // Names are waiting for their first attempt (or one is running).
  AUTO_HTTPS_STATE_PENDING = 2;
  // Every name of the site is covered by an automatic certificate.
  AUTO_HTTPS_STATE_COVERED = 3;
  // The domain is covered; some aliases were skipped and are retried later.
  AUTO_HTTPS_STATE_PARTIAL = 4;
  // No certificate could be obtained yet; retried later (see next_attempt).
  AUTO_HTTPS_STATE_FAILED = 5;
  // The site has a valid uploaded certificate, which is never replaced.
  AUTO_HTTPS_STATE_UPLOADED = 6;
  // The tenant is suspended; nothing is requested until it is resumed.
  AUTO_HTTPS_STATE_SUSPENDED = 7;
}

message AutoHttpsSkippedName {
  string name = 1;
  // Why, in plain words (e.g. "the name does not resolve").
  string reason = 2;
  google.protobuf.Timestamp next_attempt = 3;
  // Consecutive failures; the wait grows 1 h, 6 h, then 24 h.
  uint32 failures = 4;
}

message AutoHttpsStatus {
  string domain = 1;
  AutoHttpsState state = 2;
  // Server names the current certificate covers.
  repeated string covered_names = 3;
  // Server names left out after failing, waiting for their next attempt.
  repeated AutoHttpsSkippedName skipped = 4;
  google.protobuf.Timestamp last_attempt = 5;
  // Earliest time anything will be tried again; absent if nothing is waiting.
  google.protobuf.Timestamp next_attempt = 6;
  // What went wrong last time, in plain words; empty after a success.
  string last_error = 7;
  // Server names not covered yet and not backing off: tried at the next run.
  repeated string pending_names = 8;
}

message RunAutoHttpsRequest {
  // Empty: every site.
  string domain = 1;
}

message RunAutoHttpsResponse {
  repeated AutoHttpsStatus sites = 1;
}

message GetAutoHttpsStatusRequest {
  // Empty: every site.
  string domain = 1;
}

message GetAutoHttpsStatusResponse {
  repeated AutoHttpsStatus sites = 1;
}

// An SSH public key that may log in over SFTP as a tenant. All of it is public.
message SftpKey {
  // "SHA256:…" as `ssh-keygen -l` prints it; identifies the key.
  string fingerprint = 1;
  // e.g. "ssh-ed25519".
  string key_type = 2;
  // The key in authorized_keys form: "<type> <base64>" (no comment).
  string public_key = 3;
  string label = 4;
  google.protobuf.Timestamp added_at = 5;
}

message AddSftpKeyRequest {
  string username = 1;
  // One line as in an id_*.pub file: "<type> <base64> [comment]". Accepted
  // types: ssh-ed25519, ecdsa-sha2-nistp256/384/521, ssh-rsa (2048..=16384
  // bits), sk-ssh-ed25519@openssh.com, sk-ecdsa-sha2-nistp256@openssh.com.
  // Key options (command=, from=, …) are refused: the engine sets them.
  string public_key = 2;
  // ^[A-Za-z0-9@._+-]{1,64}$ or empty (= the key's own comment, if it is
  // such a string).
  string label = 3;
}

message AddSftpKeyResponse {
  SftpKey key = 1;
  // false when the tenant already had this key with this label.
  bool changed = 2;
}

message RemoveSftpKeyRequest {
  string username = 1;
  string fingerprint = 2;
  // Also end the tenant's running SFTP sessions (all of them: sshd cannot
  // tell which credential a session used). Default: they continue.
  bool end_sessions = 3;
}

message RemoveSftpKeyResponse {
  // Keys the tenant still has.
  uint32 remaining = 1;
}

message ListSftpKeysRequest {
  string username = 1;
}

message ListSftpKeysResponse {
  // Oldest first.
  repeated SftpKey keys = 1;
}

message SetSftpPasswordRequest {
  string username = 1;
  // 12..=256 characters, no control characters. Further policy (strength,
  // reuse) is the panel's. Never logged, never in an argv, never returned.
  string password = 2;
}

message SetSftpPasswordResponse {
  Tenant tenant = 1;
}

message ClearSftpPasswordRequest {
  string username = 1;
  // Also end the tenant's running SFTP sessions. Default: they continue.
  bool end_sessions = 2;
}

message ClearSftpPasswordResponse {
  // false when the tenant had no SFTP password.
  bool cleared = 1;
  Tenant tenant = 2;
}

// A database owned by a tenant.
message Database {
  // "<tenant>_<suffix>", suffix ^[a-z0-9]{1,24}$.
  string name = 1;
  string tenant = 2;
  // Data plus indexes as the server reports them; 0 when the server could
  // not be asked.
  uint64 size_bytes = 3;
  google.protobuf.Timestamp created_at = 4;
  DatabaseEngine engine = 5;
}

// A database account owned by a tenant; on MariaDB '<name>'@'localhost'
// (UNIX socket or loopback only). The password is never stored by the
// engine nor returned.
message DatabaseUser {
  // "<tenant>_<suffix>", suffix ^[a-z0-9]{1,24}$.
  string name = 1;
  string tenant = 2;
  // Databases (of the same tenant) this user may work in.
  repeated string databases = 3;
  // Most simultaneous connections (MariaDB MAX_USER_CONNECTIONS).
  uint32 max_connections = 4;
  google.protobuf.Timestamp created_at = 5;
  DatabaseEngine engine = 6;
}

message CreateDatabaseRequest {
  string tenant = 1;
  // Full name; must start with "<tenant>_".
  string name = 2;
  // UNSPECIFIED = MariaDB.
  DatabaseEngine engine = 3;
}

message CreateDatabaseResponse {
  Database database = 1;
  // false when the database already existed.
  bool created = 2;
}

message ListDatabasesRequest {
  // Empty = all tenants.
  string tenant = 1;
}

message ListDatabasesResponse {
  repeated Database databases = 1;
}

message DeleteDatabaseRequest {
  string name = 1;
}

message DeleteDatabaseResponse {
  // false when OxPanel has no such database.
  bool deleted = 1;
}

message CreateDatabaseUserRequest {
  string tenant = 1;
  // Full name; must start with "<tenant>_".
  string name = 2;
  // 8..=128 characters, no control characters. Used once to derive what the
  // server stores; never logged, stored or returned. Repeating the request
  // for a user that exists does NOT change its password (use
  // SetDatabaseUserPassword).
  string password = 3;
  // UNSPECIFIED = MariaDB. A user can only be granted databases of its engine.
  DatabaseEngine engine = 4;
}

message CreateDatabaseUserResponse {
  DatabaseUser user = 1;
  // false when the user already existed.
  bool created = 2;
}

message ListDatabaseUsersRequest {
  // Empty = all tenants.
  string tenant = 1;
}

message ListDatabaseUsersResponse {
  repeated DatabaseUser users = 1;
}

message SetDatabaseUserPasswordRequest {
  string name = 1;
  // Same rules as CreateDatabaseUserRequest.password.
  string password = 2;
}

message SetDatabaseUserPasswordResponse {}

message DeleteDatabaseUserRequest {
  string name = 1;
}

message DeleteDatabaseUserResponse {
  // false when OxPanel has no such user.
  bool deleted = 1;
}

message GrantDatabaseAccessRequest {
  string user = 1;
  // Must belong to the same tenant as `user`.
  string database = 2;
}

message GrantDatabaseAccessResponse {
  DatabaseUser user = 1;
  // false when the user already had access.
  bool changed = 2;
}

message RevokeDatabaseAccessRequest {
  string user = 1;
  string database = 2;
}

message RevokeDatabaseAccessResponse {
  DatabaseUser user = 1;
  // false when the user had no access.
  bool changed = 2;
}

enum BackupState {
  BACKUP_STATE_UNSPECIFIED = 0;
  // The job writing it is still running. Not restorable yet.
  BACKUP_STATE_CREATING = 1;
  // Complete: every member is stored with its size and checksum.
  BACKUP_STATE_READY = 2;
}

// One file of a backup.
message BackupMember {
  // File name inside the backup, e.g. "home.tar.gz".
  string name = 1;
  // What it holds: "home" (the tenant's home directory as a gzip-compressed
  // tar archive) or "records" (the engine's records of the tenant and its
  // virtual hosts, JSON). Clients must tolerate kinds they do not know.
  string kind = 2;
  uint64 size_bytes = 3;
  // Lower-case hexadecimal SHA-256, verified before a restore.
  string sha256 = 4;
}

message Backup {
  // Assigned by the engine: "b" followed by digits; sorts by creation time.
  string id = 1;
  string tenant = 2;
  google.protobuf.Timestamp created_at = 3;
  BackupState state = 4;
  // Total size on disk; 0 while CREATING.
  uint64 size_bytes = 5;
  repeated BackupMember members = 6;
  // The tenant's virtual hosts when the backup was made.
  repeated string domains = 7;
  // Set when the backup is retained: kept until then whatever the
  // per-tenant count says (also after the tenant is deleted), then removed.
  google.protobuf.Timestamp retain_until = 8;
  // The tenant this backup was taken from has been deleted; the backup is
  // only reachable through the retained-backup operations.
  bool tenant_deleted = 9;
  // What the home archive leaves out, by rule (node_modules, Python
  // virtualenvs, download caches) ...
  repeated string exclude_rules = 10;
  // ... and the directories (relative to the home; "." is the home itself)
  // those rules matched when the backup was started: at most 200 are named,
  // `excluded_count` counts them all. A directory a tenant marked with a
  // pyvenv.cfg is listed here, so nothing is left out silently.
  repeated string excluded = 11;
  uint64 excluded_count = 12;
}

// What a restore does with files that already exist in the home.
enum OnExisting {
  // Refused: the caller must choose.
  ON_EXISTING_UNSPECIFIED = 0;
  // Files in the backup replace existing ones (never written through: an
  // existing file or symlink is replaced, not opened).
  ON_EXISTING_OVERWRITE = 1;
  // Existing files, symlinks and directories are left untouched; only what
  // is missing is restored.
  ON_EXISTING_KEEP = 2;
}

// What happened to one application site after a restore.
message JobSiteResult {
  string domain = 1;
  // Virtualenv (Python) and dependencies reinstalled, or nothing to install.
  bool succeeded = 2;
  string detail = 3;
}

enum JobKind {
  JOB_KIND_UNSPECIFIED = 0;
  JOB_KIND_BACKUP = 1;
  JOB_KIND_RESTORE = 2;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_RUNNING = 1;
  JOB_STATE_SUCCEEDED = 2;
  // A failed backup leaves no backup behind. A failed restore may have
  // restored part of the files; `message` and `output` say what happened.
  JOB_STATE_FAILED = 3;
}

message Job {
  // Assigned by the engine: "j" followed by digits.
  string id = 1;
  JobKind kind = 2;
  string tenant = 3;
  // The backup being written or restored from.
  string backup_id = 4;
  JobState state = 5;
  // One line from the engine about the outcome; empty while RUNNING.
  string message = 6;
  // The end of what the worker printed: files that were skipped, the reason
  // of a failure. May contain file names chosen by the tenant.
  string output = 7;
  google.protobuf.Timestamp started_at = 8;
  // Unset while RUNNING.
  google.protobuf.Timestamp finished_at = 9;
  // Restores: the caller's choice, archive entries written, and entries
  // left alone because they existed (directories count as entries).
  OnExisting on_existing = 10;
  uint64 restored_entries = 11;
  uint64 skipped_entries = 12;
  // Restores: per application site, whether its dependencies could be
  // reinstalled. A failure here does not make the restore FAILED; `message`
  // names the sites.
  repeated JobSiteResult sites = 13;
}

message CreateBackupRequest {
  string tenant = 1;
  // 0: an ordinary backup. 1-12: retained for that many months (see
  // RetainBackup) — e.g. the final backup before deleting the tenant.
  uint32 retain_months = 2;
}

message StartJobResponse {
  Job job = 1;
  // false when an identical job was already running and is returned instead.
  bool started = 2;
}

message ListBackupsRequest {
  string tenant = 1;
}

message ListBackupsResponse {
  // Oldest first.
  repeated Backup backups = 1;
}

message DeleteBackupRequest {
  string tenant = 1;
  string backup_id = 2;
  // Delete a retained backup of the DELETED tenant named `tenant` before its
  // date. Without it, only backups of the existing tenant are found.
  bool tenant_deleted = 3;
}

message DeleteBackupResponse {
  // false when the tenant has no such backup.
  bool deleted = 1;
}

message RestoreBackupRequest {
  // The tenant to restore. The backup must be one of this tenant's own:
  // another tenant's backup is NOT_FOUND here.
  string tenant = 1;
  string backup_id = 2;
  // Required: UNSPECIFIED is INVALID_ARGUMENT.
  OnExisting on_existing = 3;
}

message GetJobRequest {
  string job_id = 1;
}

message RetainBackupRequest {
  string tenant = 1;
  string backup_id = 2;
  // 1 to 12.
  uint32 retain_months = 3;
}

message ListRetainedBackupsRequest {}

message RestoreRetainedBackupRequest {
  string backup_id = 1;
  // The (deleted) tenant the backup was taken from, as listed.
  string source_tenant = 2;
  // The existing tenant whose home receives the files, as that tenant.
  string target_tenant = 3;
  // Required: UNSPECIFIED is INVALID_ARGUMENT.
  OnExisting on_existing = 4;
}

// --- DNS hosting ------------------------------------------------------------

// DNS hosting as configured on this host (OXPANEL_DNS_*).
message DnsHostInfo {
  // OXPANEL_DNS: the operator switched DNS hosting on.
  bool enabled = 1;
  // Enabled, and the DNS server and the public suffix list are installed.
  bool available = 2;
  // In plain words: what is missing, or what is wrong.
  string detail = 3;
  // The name servers every zone is delegated to (NS records), in order.
  repeated string nameservers = 4;
  string soa_contact = 5;
  // Addresses the engine's address records point at.
  string ipv4 = 6;
  string ipv6 = 7;
  // Secondary name servers that receive NOTIFY and may transfer zones (TSIG).
  repeated string secondaries = 8;
  uint32 default_ttl = 9;
  // Things the operator should know: one name server only, no secondary
  // (every name-server name answered by this host alone: no redundancy), a
  // stock named.service competing for port 53.
  repeated string warnings = 10;
  uint32 zone_count = 11;
  // The DNS server's version as installed (queries never reveal it).
  string server_version = 12;
  bool server_running = 13;
}

enum DnsRecordType {
  DNS_RECORD_TYPE_UNSPECIFIED = 0;
  DNS_RECORD_TYPE_A = 1;
  DNS_RECORD_TYPE_AAAA = 2;
  DNS_RECORD_TYPE_CNAME = 3;
  DNS_RECORD_TYPE_MX = 4;
  DNS_RECORD_TYPE_TXT = 5;
  DNS_RECORD_TYPE_SRV = 6;
  DNS_RECORD_TYPE_CAA = 7;
  // Delegation of a name below the apex to other name servers.
  DNS_RECORD_TYPE_NS = 8;
  // Read-only: the engine's own start of authority.
  DNS_RECORD_TYPE_SOA = 9;
}

// One resource record. Which fields carry the data depends on `type`:
//   A, AAAA       value = the address
//   CNAME, NS     value = the target host name
//   MX            priority = preference, value = mail server host name
//                 ("." with priority 0: the domain receives no mail)
//   TXT           value = the text, printable ASCII, up to 4000 characters;
//                 the engine splits it into 255-byte strings and quotes it
//   SRV           priority, weight, port, value = target host name ("." =
//                 no such service)
//   CAA           caa_flags (0 or 128), caa_tag (issue, issuewild, iodef),
//                 value = the property value
// Host names are absolute (a trailing dot is optional). `name` is relative to
// the zone: "@" for the apex, "www", "_dmarc", "*.dev" (a wildcard, leftmost
// label only).
message DnsRecord {
  // 0 for the engine's own records; stable for the tenant's.
  uint64 id = 1;
  string name = 2;
  DnsRecordType type = 3;
  // 0 = the zone's default TTL.
  uint32 ttl = 4;
  string value = 5;
  uint32 priority = 6;
  uint32 weight = 7;
  uint32 port = 8;
  uint32 caa_flags = 9;
  string caa_tag = 10;
  // Maintained by the engine (SOA, the apex NS records, the address records
  // of sites): read-only through this API.
  bool protected = 11;
  // Why a protected record exists: "zone", or "site:<domain>".
  string origin = 12;
}

enum DnssecState {
  DNSSEC_STATE_UNSPECIFIED = 0;
  DNSSEC_STATE_OFF = 1;
  // Switched on; the DNS server is generating keys and signing.
  DNSSEC_STATE_SIGNING = 2;
  // Signed: give the DS record(s) to the registrar.
  DNSSEC_STATE_SIGNED = 3;
}

message DnssecInfo {
  DnssecState state = 1;
  // "<zone>. IN DS <key tag> 13 2 <digest>": what the registrar needs.
  repeated string ds_records = 2;
  // The key-signing key(s), for registrars that ask for the key instead.
  repeated string dnskey_records = 3;
  string algorithm = 4;
  // How non-existence is proven: NSEC3 (no salt, no extra iterations).
  string denial_of_existence = 5;
}

message DnsZone {
  string zone = 1;
  string tenant = 2;
  // Created for a site, not explicitly.
  bool automatic = 3;
  // The serial of the zone as last rendered (a signed zone is served with
  // the DNS server's own, higher serial).
  uint32 serial = 4;
  google.protobuf.Timestamp created_at = 5;
  // Every record, the engine's included (GetDnsZone, ResetDnsZone,
  // SetDnssec); empty in listings.
  repeated DnsRecord records = 6;
  DnssecInfo dnssec = 7;
  // Sites whose names have address records in this zone.
  repeated string sites = 8;
  // Records the tenant added.
  uint32 record_count = 9;
}

message CreateDnsZoneRequest {
  string tenant = 1;
  // The apex, e.g. "example.com".
  string zone = 2;
}

message CreateDnsZoneResponse {
  DnsZone zone = 1;
  bool created = 2;
}

message ListDnsZonesRequest {
  // Empty = every tenant.
  string tenant = 1;
}

message ListDnsZonesResponse {
  repeated DnsZone zones = 1;
}

message GetDnsZoneRequest {
  string tenant = 1;
  string zone = 2;
}

message DeleteDnsZoneRequest {
  string tenant = 1;
  string zone = 2;
}

message DeleteDnsZoneResponse {
  bool deleted = 1;
}

message AddDnsRecordRequest {
  string tenant = 1;
  string zone = 2;
  // `id`, `protected` and `origin` are ignored.
  DnsRecord record = 3;
}

message UpdateDnsRecordRequest {
  string tenant = 1;
  string zone = 2;
  uint64 id = 3;
  DnsRecord record = 4;
}

message DnsRecordResponse {
  DnsRecord record = 1;
  // false when the zone already held exactly this record.
  bool changed = 2;
  uint32 serial = 3;
}

message RemoveDnsRecordRequest {
  string tenant = 1;
  string zone = 2;
  uint64 id = 3;
}

message RemoveDnsRecordResponse {
  bool removed = 1;
  uint32 serial = 2;
}

message ResetDnsZoneRequest {
  string tenant = 1;
  string zone = 2;
}

message CheckDnsZoneRequest {
  string tenant = 1;
  string zone = 2;
}

enum DelegationState {
  DELEGATION_STATE_UNSPECIFIED = 0;
  // The public DNS names exactly the configured name servers for the domain.
  DELEGATION_STATE_DELEGATED = 1;
  // Some of the configured name servers, but not all, or others as well.
  DELEGATION_STATE_PARTIAL = 2;
  // The domain's name servers are others: this host's zone is not used.
  DELEGATION_STATE_ELSEWHERE = 3;
  // The domain does not exist in the public DNS (not registered?).
  DELEGATION_STATE_NOT_FOUND = 4;
  // The check could not be made (no resolver, no network, no answer).
  DELEGATION_STATE_UNKNOWN = 5;
}

message NameServerSerial {
  // "primary" (this host) or the secondary's address.
  string server = 1;
  // 0 when the server did not answer authoritatively.
  uint32 serial = 2;
  // "ok", "behind", "not serving the zone", "no answer".
  string status = 3;
}

message DnsZoneCheck {
  string zone = 1;
  DelegationState delegation = 2;
  // The name servers the public DNS names for the domain.
  repeated string nameservers_seen = 3;
  // What to do, in plain words.
  string guidance = 4;
  // DS records the parent publishes for the zone (empty: none).
  repeated string ds_at_parent = 5;
  // The parent's DS matches one of the zone's keys.
  bool ds_matches = 6;
  repeated NameServerSerial serials = 7;
  // Whether the parent's DS records could be looked up at all.
  bool ds_checked = 8;
}

message SetDnssecRequest {
  string tenant = 1;
  string zone = 2;
  bool enabled = 3;
  // Switch off although the parent could not be checked for a DS record.
  // (A DS record that IS published still refuses.)
  bool force = 4;
}
