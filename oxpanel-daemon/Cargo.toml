[package]
name = "oxpanel-daemon"
description = "OxPanel privileged system engine: tenant provisioning, cgroups-v2 resource isolation and Nginx virtual hosts behind an authenticated UNIX-socket gRPC API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "oxpanel_daemon"
path = "src/lib.rs"

[[bin]]
name = "oxpanel-daemon"
path = "src/main.rs"

[features]
default = []
# Enables tests that need root and a real AlmaLinux 9 userland (useradd, nginx,
# systemd). Run them inside the integration container: `make integration`.
integration = []

[dependencies]
oxpanel-proto = { path = "../oxpanel-proto" }
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
prost-types.workspace = true
nix.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sd-notify.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
tonic = { workspace = true, features = ["channel"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Test-only: property tests, and a raw HTTP/2 client for malformed gRPC frames.
proptest = { version = "1", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["client", "http2"] }
http-body-util = "0.1"
bytes = "1"
prost.workspace = true

[lints]
workspace = true
