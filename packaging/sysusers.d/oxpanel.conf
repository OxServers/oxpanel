# Group whose members may call the oxpanel-daemon API (owns the socket).
g oxpanel - -
# Unprivileged account the ACME client (oxpanel-acme) runs as, in a transient
# unit started by the daemon. Owns only its working directories below
# /var/lib/oxpanel-acme; it can never read a site's private key.
u oxpanel-acme - "OxPanel ACME client" /var/lib/oxpanel-acme /sbin/nologin
