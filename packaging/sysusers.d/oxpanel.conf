# Group whose members may call the oxpanel-daemon API (owns the socket).
g oxpanel - -
# Unprivileged account the ACME client (oxpanel-acme) runs as, in a transient
# unit started by the daemon. Owns only its working directories below
# /var/lib/oxpanel-acme; it can never read a site's private key.
u oxpanel-acme - "OxPanel ACME client" /var/lib/oxpanel-acme /sbin/nologin
# Every tenant account is a member. OxPanel's sshd drop-in confines members
# to chrooted SFTP with keys only OxPanel can change. Grants no file access.
g oxpanel-tenants - -
# Tenants that have an SFTP password; sshd offers password login to these
# members only (same confinement as keys). Grants no file access.
g oxpanel-sftp-password - -
# Email (optional; used once email is switched on). The mail policy service
# (oxpanel-mail-policy.service) counts and limits sending and hands in the
# mail of sites; it reads the map the daemon renders and writes its counters.
u oxpanel-mail - "OxPanel mail policy service" /var/lib/oxpanel-mail /sbin/nologin
# Roundcube's PHP (oxpanel-webmail.service): owns only its database and
# temporary files below /var/lib/oxpanel-webmail.
u oxpanel-webmail - "OxPanel webmail" /var/lib/oxpanel-webmail /sbin/nologin
