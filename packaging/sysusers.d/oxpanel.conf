# Group whose members may call the oxpanel-daemon API (owns the socket).
g oxpanel - -
# Every tenant account is a member. OxPanel's sshd drop-in confines members
# to chrooted SFTP with keys only OxPanel can change. Grants no file access.
g oxpanel-tenants - -
# Tenants that have an SFTP password; sshd offers password login to these
# members only (same confinement as keys). Grants no file access.
g oxpanel-sftp-password - -
