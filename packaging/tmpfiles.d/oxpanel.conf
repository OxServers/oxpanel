# Configuration directory; the environment file is root-readable only.
d /etc/oxpanel 0750 root oxpanel -
z /etc/oxpanel/daemon.env 0640 root root -
# Per-virtual-host logs. Rotated files of sites that no longer exist age out.
d /var/log/nginx/oxpanel 0750 root root 90d
# PHP-FPM pool configurations: read by each tenant's own FPM master, no secrets.
d /etc/oxpanel-php 0755 root root -
# HTTPS: certificates and private keys of virtual hosts. Root only; Nginx's
# master process (root) reads them. Labelled cert_t like the rest of /etc/pki.
d /etc/pki/oxpanel 0700 root root -
# ACME (see oxpanel-daemon/src/acme.rs). Keep in step with OXPANEL_ACME_DIR.
d /var/lib/oxpanel-acme 0755 root root -
#   the client's account key
d /var/lib/oxpanel-acme/account 0700 oxpanel-acme oxpanel-acme -
#   HTTP-01 tokens, served by Nginx under /.well-known/acme-challenge/
d /var/lib/oxpanel-acme/challenges 0755 oxpanel-acme oxpanel-acme -
#   issued chains, read (never followed) by the daemon
d /var/lib/oxpanel-acme/issued 0700 oxpanel-acme oxpanel-acme -
#   signing requests written by the daemon (public)
d /var/lib/oxpanel-acme/csr 0755 root root -
