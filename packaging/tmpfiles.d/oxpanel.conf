# Configuration directory; the environment file is root-readable only.
d /etc/oxpanel 0750 root oxpanel -
z /etc/oxpanel/daemon.env 0640 root root -
# Per-virtual-host logs. Rotated files of sites that no longer exist age out.
d /var/log/nginx/oxpanel 0750 root root 90d
# PHP-FPM pool configurations: read by each tenant's own FPM master, no secrets.
d /etc/oxpanel-php 0755 root root -
# Backups: root-only, never inside a tenant's reach (see OXPANEL_BACKUP_DIR).
d /var/lib/oxpanel-backups 0700 root root -
