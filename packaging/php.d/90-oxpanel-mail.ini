; OxPanel: PHP's mail() goes through OxPanel's sendmail, which hands a
; site's mail to the mail policy service: the account is taken from the
; process's uid, the sender must be at one of its domains, and its hourly
; limit applies. For callers that are not hosting accounts, and while email
; is off, it passes the message to Postfix's sendmail unchanged.
; (sendmail_path cannot be changed by a site: it is a system-level setting.)
sendmail_path = "/usr/sbin/oxpanel-daemon sendmail -t -i"
